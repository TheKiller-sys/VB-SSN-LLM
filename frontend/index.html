<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNN-LM v4.3</title>
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html { color-scheme: dark; }
  .tab { @apply px-3 py-1.5 rounded text-sm cursor-pointer; }
  .tab.active { @apply bg-blue-600 text-white; }
  .tab:not(.active) { @apply bg-slate-800 text-slate-300 hover:bg-slate-700; }
  .btn { @apply px-3 py-1.5 rounded text-sm bg-slate-700 hover:bg-slate-600; }
  .btn-primary { @apply bg-blue-600 hover:bg-blue-500; }
  .btn-danger { @apply bg-red-600 hover:bg-red-500; }
  .input { @apply w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm; }
  .card { @apply bg-slate-800 rounded p-4; }
  .label { @apply text-xs uppercase text-slate-400 tracking-wide; }
  .pre { @apply bg-black/60 p-3 rounded font-mono text-xs whitespace-pre-wrap max-h-96 overflow-auto; }
  .badge { @apply inline-block px-2 py-0.5 rounded text-xs font-mono; }
</style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans">

<header class="flex items-center justify-between px-6 py-3 border-b border-slate-800">
  <div class="flex items-center gap-4">
    <h1 class="text-xl font-bold">SNN-LM <span class="text-blue-400">v4.3</span></h1>
    <span id="model-badge" class="badge bg-slate-700">loading…</span>
    <span id="jobs-badge" class="badge bg-slate-700">jobs: 0</span>
  </div>
  <div class="text-xs text-slate-400">
    <span id="health-status">health: ?</span>
  </div>
</header>

<div class="flex min-h-[calc(100vh-3.5rem)]">

  <aside class="w-56 border-r border-slate-800 p-3 space-y-1">
    <div class="label mb-2">Workspace</div>
    <div id="nav" class="space-y-1"></div>
  </aside>

  <main id="main" class="flex-1 p-6 overflow-auto"></main>

</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-4 right-4 space-y-2 z-50"></div>

<script src="/app.js"></script>
</body>
</html>
